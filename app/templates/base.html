<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{% block title %}{{ business.name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to main content</a>

  {% block chrome %}{% endblock %}

  <main id="main" class="page">
    {% block content %}{% endblock %}
  </main>

  <div id="flash-stack" class="flash-stack" aria-live="polite" aria-atomic="true">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">
          <span>{{ message }}</span>
          <button type="button" class="flash-close" onclick="this.parentElement.remove()" aria-label="Dismiss">&times;</button>
        </div>
      {% endfor %}
    {% endwith %}
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
